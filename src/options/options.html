<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title data-i18n="optionsTitle">DualTran Options</title>
  <style>
    /* Thunderbird renders options_ui inside a fixed-height browser element whose
       own overflow is hidden: without scrolling on the document, every control
       below the fold (Custom base URL included) cannot be reached by wheel, Page
       Down or Tab. */
    html, body { height: 100%; }
    body { font: 14px/1.6 system-ui, sans-serif; margin: 16px; min-width: 340px;
           overflow-y: auto; box-sizing: border-box; }
    h1 { font-size: 16px; margin: 0 0 12px; }
    label { display: block; margin: 10px 0 2px; font-weight: 600; }
    input[type="text"], select { width: 100%; box-sizing: border-box; padding: 4px 6px; }
    fieldset { border: 1px solid #ccc; border-radius: 6px; margin: 12px 0; padding: 4px 12px 12px; }
    #ai-fields[hidden] { display: none; }
    button { margin-top: 12px; padding: 6px 16px; }
    .muted { color: #666; font-size: 12px; }
    input[type="color"] { width: 64px; height: 28px; padding: 0 2px; }
    #appearance label { margin-top: 8px; }
  </style>
</head>
<body>
  <h1 data-i18n="optionsTitle">DualTran Options</h1>

  <label data-i18n="optionTargetLang" for="targetLang">Translate into</label>
  <select id="targetLang"></select>

  <!-- No engine picker: the floating Original / Google / AI group chooses the
       engine per click, so a stored "default engine" only ever acted as an
       unused fallback. The AI fields are always shown because the AI button is
       always one click away. -->
  <fieldset id="ai-fields">
    <label data-i18n="optionProvider" for="provider">Provider</label>
    <select id="provider"></select>
    <label data-i18n="optionApiKey" for="apiKey">API key</label>
    <!-- password: this node screenshots the page during installs and a plain field
         leaked the operator's BYOK key. Deliberately diverges from the Chrome build. -->
    <input type="password" id="apiKey" autocomplete="off" />
    <label data-i18n="optionModel" for="model">Model</label>
    <select id="modelSelect"></select>
    <label data-i18n="optionCustomModel" for="model" id="customModelLabel" hidden>Custom model</label>
    <input type="text" id="model" placeholder="" hidden />
    <label data-i18n="optionReasoning" for="reasoning">Reasoning effort</label>
    <select id="reasoning"></select>
    <label data-i18n="optionBaseUrl" for="baseURL">Custom base URL</label>
    <input type="text" id="baseURL" placeholder="" />
    <p class="muted" data-i18n="optionApiKeyHint">Stored locally in Thunderbird only; requests go straight to your provider.</p>
  </fieldset>

  <fieldset id="appearance">
    <legend data-i18n="optionAppearance">Appearance</legend>
    <label data-i18n="optionGoogleColor" for="translatedColor">Google translation colour</label>
    <input type="color" id="translatedColor" />
    <label data-i18n="optionAiColor" for="aiTranslatedColor">AI translation colour</label>
    <input type="color" id="aiTranslatedColor" />
  </fieldset>

  <span id="status" class="muted" role="status" aria-live="polite"></span>

  <script src="catalog.js"></script>
  <script src="languages.js"></script>
  <script src="options.js"></script>
</body>
</html>
